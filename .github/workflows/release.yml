name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  required-contracts:
    name: Required release contracts / ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu-node-22
            os: ubuntu
            runner: ubuntu-latest
            node: "22"
          - lane: ubuntu-node-24
            os: ubuntu
            runner: ubuntu-latest
            node: "24"
          - lane: windows-node-22
            os: windows
            runner: windows-latest
            node: "22"
          - lane: windows-node-24
            os: windows
            runner: windows-latest
            node: "24"
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up required Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install audited dependency graph
        run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        run: >-
          node -e "const packageJson=require('./package.json');
          const expectedTag='v'+packageJson.version;
          if(process.env.GITHUB_REF_NAME!==expectedTag){process.exit(1)}"
      - name: Build CommonJS products and tests
        run: npm run build
      - name: Audit exact dependency graph
        run: npm run deps:audit
      - name: Run platform launcher smoke
        run: npm run test:launcher
      - name: Run partitioned Node test suite
        run: npm run test:ci
      - name: Check deterministic generated products
        run: npm run generate:check
      - name: Validate canonical docs and secret scans
        run: npm run docs:check
      - name: Audit retired authority directly
        run: npm run audit:retirement
      - name: Run required five-host contract smoke
        run: npm run smoke:required
      - name: Audit real npm tarball
        run: npm run pack:audit

  publish:
    name: Verify and publish matching npm tag
    needs: required-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node and npm registry
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install audited dependency graph
        run: npm ci --ignore-scripts
      - name: Verify tag matches package version
        run: >-
          node -e "const packageJson=require('./package.json');
          const expectedTag='v'+packageJson.version;
          if(process.env.GITHUB_REF_NAME!==expectedTag){process.exit(1)}"
      - name: Build CommonJS products and tests
        run: npm run build
      - name: Audit exact dependency graph
        run: npm run deps:audit
      - name: Audit real npm tarball
        run: npm run pack:audit
      - name: Publish verified immutable package
        run: npm publish --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
