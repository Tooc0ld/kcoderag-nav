name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      release: true

  publish:
    name: Publish the verified npm tarball
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build maintainer verifier
        run: npm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/exact-package
      - name: Reopen exact package identity before publication
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/exact-package
          CANDIDATE_SHA: ${{ github.sha }}
          MANIFEST_SHA: ${{ needs.verify.outputs.manifest-sha256 }}
        run: |
          node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)process.exit(1)"
          node dist/maintainer/exact-package.cjs verify "$PACKAGE_ROOT" "$CANDIDATE_SHA" "$MANIFEST_SHA"
      - name: Publish verified immutable package once
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/exact-package
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "$PACKAGE_ROOT/package/candidate.tgz" --access public --ignore-scripts

  registry-readiness:
    name: Verify public npm availability
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact-id }}
          path: ${{ runner.temp }}/exact-package
      - name: Poll exact version, latest and standard fresh-cache npm pack
        env:
          PACKAGE_ROOT: ${{ runner.temp }}/exact-package
          CANDIDATE_SHA: ${{ github.sha }}
          MANIFEST_SHA: ${{ needs.verify.outputs.manifest-sha256 }}
          RECEIPT: ${{ runner.temp }}/registry-readiness.json
        run: node dist/maintainer/registry-readiness.cjs "$PACKAGE_ROOT" "$CANDIDATE_SHA" "$MANIFEST_SHA" "$RECEIPT"
      - name: Preserve registry readiness or pending evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: registry-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/registry-readiness.json
          if-no-files-found: warn
          retention-days: 7
