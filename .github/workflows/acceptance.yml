name: Exact candidate host acceptance

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:
    inputs:
      candidateSha:
        description: Exact product commit to package
        required: true
        type: string
      candidateRef:
        description: Exact branch ref that resolves to the product commit
        required: true
        type: string
      packageSha256:
        description: Expected actual tgz SHA-256 for an authorized LIVE run
        required: true
        type: string
      packageMemberDigest:
        description: Expected closed member digest for an authorized LIVE run
        required: true
        type: string
      workflowBlobSha:
        description: Expected acceptance workflow blob at candidateSha
        required: true
        type: string
  workflow_dispatch:
    inputs:
      candidateSha:
        description: Exact product commit to package and run
        required: true
        type: string
      candidateRef:
        description: Exact dedicated Phase 05 branch ref
        required: true
        type: string
      packageSha256:
        description: Expected actual tgz SHA-256
        required: true
        type: string
      packageMemberDigest:
        description: Expected closed package-member digest
        required: true
        type: string
      workflowBlobSha:
        description: Expected acceptance workflow blob at candidateSha
        required: true
        type: string

permissions:
  contents: read

env:
  ACCEPTANCE_SUBJECT: ${{ inputs.candidateSha || github.event.pull_request.head.sha || github.sha }}

jobs:
  package:
    name: Build one exact acceptance package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.package.outputs.artifact-id }}
      artifact-name: ${{ steps.package.outputs.artifact-name }}
      artifact-sha256: ${{ steps.package.outputs.artifact-sha256 }}
      member-count: ${{ steps.package.outputs.member-count }}
      package-member-digest: ${{ steps.member-digest.outputs.package-member-digest }}
      candidate-sha: ${{ steps.package.outputs.candidate-subject }}
    steps:
      - name: Checkout exact acceptance subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.ACCEPTANCE_SUBJECT }}
          persist-credentials: false
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install audited dependency graph
        run: npm ci --ignore-scripts
      - name: Build candidate tools
        run: npm run build
      - name: Produce and upload the only actual tgz
        id: package
        env:
          READINESS_PROVENANCE_PROFILE: acceptance
          READINESS_CANDIDATE_SHA: ${{ env.ACCEPTANCE_SUBJECT }}
          READINESS_CANDIDATE_REF: ${{ inputs.candidateRef || github.ref }}
          READINESS_WORKFLOW_COMMIT: ${{ github.workflow_sha }}
          READINESS_WORKFLOW_BLOB_SHA: ${{ inputs.workflowBlobSha }}
        uses: ./.github/actions/readiness-upload
      - name: Close package member identity
        id: member-digest
        shell: pwsh
        run: |
          $material = '${{ steps.package.outputs.artifact-sha256 }}:${{ steps.package.outputs.member-count }}'
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($material)
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "package-member-digest=$digest" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  packaged:
    name: PACKAGED / ${{ matrix.lane }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu-node22
            os: linux
            runner: ubuntu-latest
            node: "22"
          - lane: ubuntu-node24
            os: linux
            runner: ubuntu-latest
            node: "24"
          - lane: windows-node22
            os: windows
            runner: windows-latest
            node: "22"
          - lane: windows-node24
            os: windows
            runner: windows-latest
            node: "24"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - name: Checkout exact acceptance subject
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.package.outputs.candidate-sha }}
          persist-credentials: false
      - name: Set up matrix Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install audited dependency graph
        run: npm ci --ignore-scripts
      - name: Build receipt consumer
        run: npm run build
      - name: Download producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate-artifact
      - name: Run exact artifact PACKAGED acceptance
        shell: pwsh
        run: >-
          npm run acceptance:packaged --
          --lane "${{ matrix.lane }}"
          --candidate-sha "${{ needs.package.outputs.candidate-sha }}"
          --package-sha256 "${{ needs.package.outputs.artifact-sha256 }}"
          --member-count "${{ needs.package.outputs.member-count }}"
          --workflow-run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --artifact-root "${{ runner.temp }}/candidate-artifact"
          --artifact-name "${{ needs.package.outputs.artifact-name }}"
          --evidence-level PACKAGED
          --output "${{ runner.temp }}/packaged-${{ matrix.lane }}.json"
      - name: Upload metadata-only PACKAGED receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-${{ matrix.lane }}
          path: ${{ runner.temp }}/packaged-${{ matrix.lane }}.json
          if-no-files-found: error
          retention-days: 7

  live:
    name: Protected Windows Node 22 five-host LIVE
    needs: package
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        github.event.repository.fork == false &&
        vars.KCODERAG_LIVE_SMOKE == 'enabled' &&
        inputs.candidateSha == needs.package.outputs.candidate-sha &&
        inputs.candidateRef == github.ref &&
        inputs.packageSha256 == needs.package.outputs.artifact-sha256 &&
        inputs.packageMemberDigest == needs.package.outputs.package-member-digest
      }}
    environment:
      name: kcoderag-live
    concurrency:
      group: kcoderag-live-windows
      cancel-in-progress: false
    runs-on: [self-hosted, Windows, X64, kcoderag-live]
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidateSha }}
          persist-credentials: false
      - name: Verify exact candidate and workflow blob
        shell: pwsh
        run: |
          if ((git rev-parse HEAD) -ne '${{ inputs.candidateSha }}') { throw 'candidate_mismatch' }
          if ((git rev-parse '${{ inputs.candidateSha }}:.github/workflows/acceptance.yml') -ne '${{ inputs.workflowBlobSha }}') {
            throw 'workflow_blob_mismatch'
          }
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
      - name: Install audited dependency graph
        run: npm ci --ignore-scripts
      - name: Build committed coordinator
        run: npm run build
      - name: Bind candidate native driver
        shell: pwsh
        run: |
          $driver = (Resolve-Path 'dist/maintainer/native-host-driver.cjs').Path
          $bytes = [System.IO.File]::ReadAllBytes($driver)
          $digest = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData($bytes)).ToLowerInvariant()
          "KCODERAG_NATIVE_DRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "KCODERAG_NATIVE_DRIVER_SHA256=$digest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          function Export-HostVersion([string]$Name, [string]$Executable) {
            $resolved = Get-Command $Executable -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($null -eq $resolved) { return }
            $text = (& $resolved.Source --version 2>$null | Out-String)
            $match = [regex]::Match($text, '(?<![0-9])[0-9]+\.[0-9]+\.[0-9]+(?![0-9])')
            if ($match.Success) {
              "KCODERAG_${Name}_VERSION=$($match.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
          Export-HostVersion 'CODEX' 'codex'
          Export-HostVersion 'CLAUDE' 'claude'
          Export-HostVersion 'CURSOR' 'cursor'
          Export-HostVersion 'OPENCODE' 'opencode'
          $zcode = Join-Path $env:LOCALAPPDATA 'Programs/ZCode/ZCode.exe'
          if (Test-Path -LiteralPath $zcode -PathType Leaf) {
            $version = (Get-Item -LiteralPath $zcode).VersionInfo.ProductVersion
            $match = [regex]::Match($version, '^[0-9]+\.[0-9]+\.[0-9]+')
            if ($match.Success) {
              "KCODERAG_ZCODE_VERSION=$($match.Value)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }
      - name: Download exact producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: ${{ runner.temp }}/candidate-artifact
      - name: Run protected five-host coordinator
        shell: pwsh
        env:
          KCODERAG_ZCODE_WORKSPACE_TRUST: ${{ vars.KCODERAG_ZCODE_WORKSPACE_TRUST }}
        run: >-
          npm run acceptance:live --
          --candidate-sha "${{ inputs.candidateSha }}"
          --package-sha256 "${{ needs.package.outputs.artifact-sha256 }}"
          --package-member-digest "${{ needs.package.outputs.package-member-digest }}"
          --member-count "${{ needs.package.outputs.member-count }}"
          --workflow-run-id "${{ github.run_id }}-${{ github.run_attempt }}"
          --artifact-root "${{ runner.temp }}/candidate-artifact"
          --output "${{ runner.temp }}/live-receipts.json"
      - name: Upload metadata-only LIVE receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-receipts
          path: ${{ runner.temp }}/live-receipts.json
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Acceptance gate
    needs: [package, packaged, live]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Reject missing, failed or bypassed lanes
        shell: pwsh
        run: |
          if ('${{ needs.package.result }}' -ne 'success') { throw 'producer_failed' }
          if ('${{ needs.packaged.result }}' -ne 'success') { throw 'packaged_incomplete' }
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ needs.live.result }}' -ne 'success') {
            throw 'live_incomplete'
          }
