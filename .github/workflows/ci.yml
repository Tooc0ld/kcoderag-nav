name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_host_smoke:
        description: Run authenticated host smoke on the isolated runner
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  offline-contracts:
    name: Offline contracts (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Check generated packages
        run: python scripts/generate_plugins.py --check
      - name: Run offline unit contracts
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Run QA generated hook regression
        run: python kcoderag-qa/hooks/test_grep_nudge.py
      - name: Run Dev generated hook regression
        run: python kcoderag-dev/hooks/test_grep_nudge.py

  authenticated-host-smoke:
    name: Optional host smoke (${{ matrix.host }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_host_smoke }}
    runs-on: [self-hosted, kcoderag-host-smoke]
    strategy:
      fail-fast: false
      matrix:
        host: [codex, claude]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Run isolated loopback host smoke
        run: python scripts/run_host_smoke.py --host ${{ matrix.host }} --json
