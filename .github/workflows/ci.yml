name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required-contracts:
    name: Required contracts / ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: ubuntu-node-22
            os: ubuntu
            runner: ubuntu-latest
            node: "22"
          - lane: ubuntu-node-24
            os: ubuntu
            runner: ubuntu-latest
            node: "24"
          - lane: windows-node-22
            os: windows
            runner: windows-latest
            node: "22"
          - lane: windows-node-24
            os: windows
            runner: windows-latest
            node: "24"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install audited dependency graph
        run: npm ci --ignore-scripts
      - name: Build CommonJS products and tests
        run: npm run build
      - name: Audit exact dependency graph
        run: npm run deps:audit
      - name: Run platform launcher smoke
        run: npm run test:launcher
      - name: Run complete Node test suite
        run: npm test
      - name: Check deterministic generated products
        run: npm run generate:check
      - name: Audit real npm tarball
        run: npm run pack:audit
      - name: Run required three-host contract smoke
        run: npm run smoke:required

  authenticated-live:
    name: Optional authenticated host smoke
    if: ${{ github.event_name == 'workflow_dispatch' && vars.KCODERAG_LIVE_SMOKE == 'enabled' }}
    runs-on: [self-hosted, kcoderag-live]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - name: Install audited dependency graph
        run: npm ci --ignore-scripts
      - name: Build CommonJS products and tests
        run: npm run build
      - name: Audit exact dependency graph
        run: npm run deps:audit
      - name: Run optional authenticated host smoke
        run: npm run smoke:live
