name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: required-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  change-scope:
    name: Change scope / documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run deps:audit
      - id: scope
        run: node dist/maintainer/ci-change-scope.cjs
      - name: Documentation and package checks
        if: ${{ steps.scope.outputs.scope == 'documentation' }}
        run: |
          npm run docs:check
          npm run guide:check
          npm run pack:audit

  verify:
    needs: change-scope
    if: ${{ needs.change-scope.outputs.scope != 'documentation' }}
    uses: ./.github/workflows/verify.yml

  ci-gate:
    name: CI gate
    needs: [change-scope, verify]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit documentation success or complete verification
        env:
          SCOPE_RESULT: ${{ needs.change-scope.result }}
          SCOPE: ${{ needs.change-scope.outputs.scope }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$SCOPE_RESULT" = success
          if [ "$SCOPE" = documentation ]; then
            test "$VERIFY_RESULT" = skipped
          else
            test "$SCOPE" = full
            test "$VERIFY_RESULT" = success
          fi
